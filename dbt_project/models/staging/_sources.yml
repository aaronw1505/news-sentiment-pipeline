version: 2

sources:
  - name: raw
    description: "Raw headlines written by the ingestion script (NewsAPI + Claude)."
    schema: raw
    tables:
      - name: raw_headlines
        description: "One row per classified headline."
        columns:
          - name: id
            description: "Stable hash of the article URL."
            data_tests:
              - unique
              - not_null
